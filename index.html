<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copper Giant Redesign Mockup</title>
    <!-- Instant client-side redirect to the final redesign version -->
    <meta http-equiv="refresh" content="0; url=CGNT-Web-Redesign/mockups/CGNT-Redesign-v9-Final.html" />
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(220, 50, 50, 0.1);
            border-top-color: #dc3232;
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin: 0 auto 20px;
        }
        a {
            color: #dc3232;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Redirecting to <a href="CGNT-Web-Redesign/mockups/CGNT-Redesign-v9-Final.html">CGNT Redesign v9 Final</a>...</p>
    </div>
</body>
</html>
